<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>红包活动</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:20px;

  background:
    linear-gradient(
      135deg,
      #fff2e8,
      #ffd7ca
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  color:#64271d;
}


.card{
  width:min(430px,100%);
  margin:30px auto;

  background:#fff;

  border-radius:25px;

  padding:25px;

  box-shadow:
    0 18px 50px
    rgba(111,37,19,.16);
}


h1{
  text-align:center;

  color:#b51f18;

  margin:0 0 8px;
}


.desc{
  text-align:center;

  color:#94736b;

  font-size:13px;

  margin-bottom:22px;
}


label{
  display:block;

  font-weight:700;

  margin:15px 0 7px;
}


input{
  width:100%;

  padding:14px;

  border:
    1px solid
    #ead4cc;

  border-radius:13px;

  font-size:16px;

  outline:none;
}


button{
  width:100%;

  padding:15px;

  margin-top:20px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      #ffd96d,
      #ffb72f
    );

  color:#8d241a;

  font-weight:800;

  font-size:16px;

  cursor:pointer;
}


button:disabled{
  opacity:.55;

  cursor:not-allowed;
}


/* =========================
   活动状态
========================= */

.status{

  margin-top:20px;

  padding:16px;

  border-radius:15px;

  background:#fff7f2;

  line-height:1.9;

  font-size:14px;

}


/* =========================
   手气王
========================= */

.lucky-winner{

  margin-top:14px;

  padding:18px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #fff8d9,
      #ffe9a8
    );

  text-align:center;

  box-shadow:
    0 5px 18px
    rgba(180,120,20,.10);

  color:#9a5a00;

  font-weight:800;
}


.lucky-title{

  font-size:16px;

  margin-bottom:5px;
}


.lucky-name{

  display:block;

  font-size:22px;

  color:#c52b18;

  margin-top:5px;
}


.lucky-amount{

  display:block;

  font-size:27px;

  color:#d22b18;

  margin-top:3px;
}


.lucky-empty{

  display:block;

  margin-top:6px;

  font-size:13px;

  color:#94736b;

  font-weight:500;
}


/* =========================
   返回
========================= */

.record-link{

  display:block;

  text-align:center;

  margin-top:18px;

  color:#9b766d;

  font-size:12px;

  text-decoration:none;
}


</style>
</head>


<body>


<div class="card">


  <h1>
    🧧 红包活动
  </h1>


  <div class="desc">
    输入姓名，参与本次红包活动
  </div>



  <!-- 姓名 -->

  <label>
    姓名
  </label>

  <input
    id="name"
    type="text"
    maxlength="20"
    placeholder="请输入您的姓名"
    autocomplete="off"
  >



  <!-- 抢红包 -->

  <button id="grab">
    🧧 抢红包
  </button>



  <!-- 活动状态 -->

  <div
    class="status"
    id="status"
  >
    正在读取活动状态……
  </div>



  <!-- =====================
       手气王
  ====================== -->

  <div
    class="lucky-winner"
    id="luckyWinner"
  >

    <div class="lucky-title">
      🏆 当前手气王
    </div>

    <span class="lucky-empty">
      正在读取……
    </span>

  </div>



  <a
    class="record-link"
    href="/records"
  >
    查看领取记录
  </a>


</div>



<script>


const $ = id =>
  document.getElementById(id);



/* =========================
   HTML 安全处理
========================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}



/* =========================
   金额格式化
========================= */

function money(value){

  const n =
    Number(value);

  if(!Number.isFinite(n)){
    return "0.00";
  }

  return n.toFixed(2);

}



/* =========================
   获取手气王
========================= */

function getLuckyWinner(records){

  if(
    !Array.isArray(records) ||
    records.length === 0
  ){

    return null;

  }


  let winner = null;


  for(
    const record of records
  ){

    if(!record){
      continue;
    }


    /*
     * 兼容你的记录可能使用：
     * amount
     * money
     * value
     */

    const amount =
      Number(
        record.amount ??
        record.money ??
        record.value ??
        0
      );


    if(
      !Number.isFinite(amount)
    ){

      continue;

    }


    if(
      !winner ||
      amount > winner.amount
    ){

      winner = {

        record:record,

        amount:amount

      };

    }

  }


  return winner;

}



/* =========================
   显示手气王
========================= */

function renderLuckyWinner(records){

  const box =
    $("luckyWinner");


  const winner =
    getLuckyWinner(records);


  /*
   * 还没有人领取
   */

  if(!winner){

    box.innerHTML = `

      <div class="lucky-title">
        🏆 当前手气王
      </div>

      <span class="lucky-empty">
        暂时还没有人领取红包
      </span>

    `;

    return;

  }


  const record =
    winner.record;


  /*
   * 兼容不同姓名字段
   */

  const name =
    record.name ??
    record.username ??
    record.userName ??
    record.nickname ??
    "匿名用户";


  box.innerHTML = `

    <div class="lucky-title">
      🏆 当前手气王
    </div>

    <span class="lucky-name">
      ${escapeHtml(String(name))}
    </span>

    <span class="lucky-empty">
      最高领取金额
    </span>

    <span class="lucky-amount">
      ¥${money(winner.amount)}
    </span>

  `;

}



/* =========================
   读取活动状态
========================= */

async function loadState(){

  try{

    const response =
      await fetch(
        "/api/state",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "读取失败"
      );

    }


    const state =
      await response.json();


    /*
     * 获取记录
     */

    const records =
      Array.isArray(state.records)
        ? state.records
        : [];


    /*
     * 活动状态
     */

    $("status").innerHTML = `

      <b>当前活动</b><br>

      红包总额：
      ¥${money(state.total)}

      <br>

      红包数量：
      ${Number(state.totalCount) || 0}
      个

      <br>

      剩余金额：
      ¥${money(state.remainingAmount)}

      <br>

      剩余红包：
      ${Number(state.remainingCount) || 0}
      个

      <br>

      已领取：
      ${records.length}
      个

    `;


    /*
     * 更新手气王
     */

    renderLuckyWinner(records);


  }catch(error){

    console.error(error);


    $("status").innerHTML =
      "暂时无法读取活动状态";


    $("luckyWinner").innerHTML = `

      <div class="lucky-title">
        🏆 当前手气王
      </div>

      <span class="lucky-empty">
        暂时无法获取
      </span>

    `;

  }

}



/* =========================
   抢红包
========================= */

$("grab").onclick =
async () => {


  const name =
    $("name").value.trim();


  if(!name){

    alert(
      "请输入您的姓名"
    );

    $("name").focus();

    return;

  }


  $("grab").disabled =
    true;

  $("grab").textContent =
    "正在抢红包……";


  try{

    /*
     * 这里使用你原来的接口
     *
     * 如果你之前的接口不是
     * /api/grab
     *
     * 就保持你原来的接口地址即可
     */

    const response =
      await fetch(
        "/api/grab",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              name:name
            })

        }
      );


    const data =
      await response.json();


    if(!data.ok){

      alert(
        data.message ||
        "领取失败"
      );

      return;

    }


    /*
     * 显示领取结果
     */

    alert(
      "恭喜 " +
      name +
      "！\n\n" +
      "抢到 ¥" +
      money(
        data.amount
      ) +
      " 红包！"
    );


    /*
     * 清空姓名
     */

    $("name").value = "";


    /*
     * 重新读取状态
     *
     * 手气王会自动更新
     */

    await loadState();


  }catch(error){

    console.error(
      error
    );


    alert(
      "网络连接失败，请稍后重试"
    );

  }finally{

    $("grab").disabled =
      false;

    $("grab").textContent =
      "🧧 抢红包";

  }

};



/* =========================
   页面加载
========================= */

loadState();


/*
 * 每 5 秒自动刷新一次
 *
 * 有人抢到大红包后，
 * 首页的手气王会自动变化。
 */

setInterval(
  loadState,
  5000
);


</script>

</body>
</html>
